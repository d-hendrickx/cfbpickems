<script>
(function () {
  /* the artifact publish wraps this file in its own body, so the classes are set here too */
  document.body.classList.add('teaser', 'theme-neutral'); document.body.dataset.colorScheme = 'dark';
  /* ?scene=picks|lock|friends|gameday|standings|chat|scribe previews one scene on a loop; default is the full film.
     The page is clean by default (tap to pause); review=1 adds the clock, the scrub bar and the sound toggle. */
  /* options come from the query (?scene=picks&review=1&mute=1&still=1&t=12.3) or, where only a hash survives
     (a published artifact), from dot-separated hash tokens: #review, #picks.review, #mute */
  var q = new URLSearchParams(location.search), tokens = (location.hash || '').replace('#', '').split('.').filter(Boolean);
  var has = function (k) { return q.get(k) === '1' || tokens.indexOf(k) >= 0; };
  var id = q.get('scene') || tokens.filter(function (k) { return TEASER.scenes[k]; })[0] || window.TEASER_SCENE || 'dubstep';   /* the approved cut (the owner, 2026-11-15: "Yes, it works"); ?scene=film is the earlier score */
  var opts = { review: has('review'), mute: has('mute'), still: has('still'), dpr: parseFloat(q.get('dpr')) || 0, q: parseFloat(q.get('q')) || 0 };
  var stage = document.getElementById('tz-stage');
  var ready = document.getElementById('tz-appcss') ? Promise.resolve('inline') : TEASER.loadAppCSS(['../css/styles.css', 'css/styles.css']);
  ready.then(function () {
    TEASER.pinPhoneCSS(390, 844);   /* the phone's screen size in teaser.css: the app's layout follows the phone, not the window */
    var scene = TEASER.scenes[id] || TEASER.scenes.dubstep;
    var player = TEASER.run({
      scene: scene, stage: stage, opts: opts,
      canvas: document.getElementById('tz-atmos'),
      phoneHost: document.getElementById('tz-phone-wrap'),
      capHost: document.getElementById('tz-caps'),
      hud: document.getElementById('tz-clock'),
      bar: document.getElementById('tz-bar'),
      scrim: document.getElementById('tz-scrim'),
      gate: document.getElementById('tz-gate'),
      muteBtn: document.getElementById('tz-mute')
    });
    window.TEASER_PLAYER = player;
    if (q.get('t')) { player.start(); player.seek(parseFloat(q.get('t')) || 0); }
  }).catch(function (e) {
    var d = document.createElement('div'); d.className = 'tz-err';
    d.textContent = 'This page could not load. Check your connection and try again.';   /* the cause goes to the console */
    stage.appendChild(d); console.error(e);
  });
})();
</script>
