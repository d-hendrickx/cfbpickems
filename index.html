<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- UN-100: locks pinch/double-tap zoom for a stable native-app feel on the
       installed app. Drew knowingly approved the WCAG 1.4.4 tradeoff on
       2026-08-07 for this private six-person league — do not re-litigate. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#500000" />
  <!-- DI-360 (UN-318) night mode — tells the browser BOTH color schemes are
       supported (form controls/scrollbars follow the OS choice natively)
       rather than assuming light-only, matching the CSS's own
       `prefers-color-scheme: dark` rule under `body.theme-neutral`. -->
  <meta name="color-scheme" content="light dark" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <!-- UN-96: iOS reads this for the home-screen label — manifest.json's
       short_name is already "Pickems"; this brings the two into agreement. -->
  <meta name="apple-mobile-web-app-title" content="Pickems" />
  <meta name="description" content="Private college football pick'em league tracker" />
  <title>CFB Pickems</title>
  <!-- Stop browsers from serving a stale HTML shell from disk cache. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="manifest" href="manifest.json" />
  <!-- UN-96: iOS reads apple-touch-icon EXCLUSIVELY for the home-screen icon —
       it does not consult manifest icons for this. sizes="180x180" is the
       primary reference; the sizeless fallback below points at the same file
       for older iOS. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="stylesheet" href="css/styles.css?v=27-1" />
  <style>
    /* v14.1: Hide app shell until JS is ready so users don't see a flash of the
       maroon header before the PIN gate / dashboard renders. JS removes the
       `cfbp-booting` class on body once layout is decided. */
    body.cfbp-booting .page-wrapper { visibility: hidden; }
  </style>
</head>
<!-- UN-110: data-tab mirrors app.js navigateTo()'s active tab; set statically
     here (matching the hardcoded default-active #page-dashboard below) so
     there's no flash before JS runs navigateTo() for the first time. -->
<body class="cfbp-booting" data-tab="dashboard">

<!-- v0.16.0: Reveal-page PIN bypass. The CFP 2K26 reveal finale links to
     ?access=scribe — honor it by setting the SAME flag the real PIN gate sets
     (persistent, exactly like a successful PIN entry), then scrub the param so
     the URL players bookmark/share stays clean. Runs before the module loads
     so the gate never flashes. Access level: identical to knowing the PIN —
     appropriate here since the reveal link goes only to the six players and
     the reveal folder will be removed from the repo after launch. -->
<script>
  (function () {
    try {
      var p = new URLSearchParams(location.search);
      if (p.get('access') === 'scribe') {
        localStorage.setItem('cfbp_site_unlocked', '1');
        history.replaceState(null, '', location.pathname);
      }
    } catch (e) { /* non-fatal */ }
  })();
</script>

<!-- Inline theme bootstrap — runs before the module loads so a player on a school
     theme doesn't see a flash of the wrong palette. It cannot import, so it must
     reimplement storage.js getTheme() literally. KEEP THE TWO IN SYNC.

     v0.17.4: default corrected 'aggie' -> 'neutral' — this block had disagreed
     with getTheme() since v0.17.0 and flashed Aggie maroon on a fresh device.

     2026-08-27: it went out of sync a SECOND time, the same way. The signed-out
     theme lock changed getTheme() to ignore the device-level settings.theme
     fallback entirely, but this block still read it — so a shared device with a
     leftover settings.theme flashed that stale palette before JS repainted it
     neutral. Exactly the defect the block exists to prevent, reintroduced by a
     change that updated two of the three places encoding "what theme is this".

     getTheme() is now: the SIGNED-IN player's preferences.theme, else 'neutral'.
     There is no device-level fallback any more. Anonymous is always neutral —
     Drew's ruling, and a full removal, not an overridable default.

     RG-198 (2026-09-21, Drew-approved) — AND THE THIRD TIME IT WENT STALE IS
     THE REASON FOR THE FIRST BRANCH BELOW. Everything this block read —
     `cfbp_session`, `cfbp_players`, `cfbp_sheet_mirror` — is dead on a Supabase
     device: app.js REMOVES the PIN-era session record on every supabase boot,
     and the adapter's first boot wipes the Sheets mirror. So this block could
     only ever answer 'neutral' after the cutover, which is the "neutral page
     while loading" Drew reported. `cfbp_theme_hint` (js/storage.js
     KEYS.THEME_HINT, device-local) is what this handset last painted, and it is
     read FIRST because it is the only one of the four that is still written.

     THE VALUE IS UNTRUSTED. It is concatenated into a class name, so it is
     checked against the seven real theme keys spelled out here — the one place
     in this file that may not import js/data-model.js's THEMES. Anything else,
     including a corrupt or absent value, is 'neutral'. KEEP THE LIST IN SYNC. -->
<script>
  (function () {
    var OK = ['aggie','sooner','trojan','irish','boilermaker','razorback','neutral'];
    try {
      var hint = JSON.parse(localStorage.getItem('cfbp_theme_hint') || 'null');
      if (typeof hint === 'string' && OK.indexOf(hint) !== -1) {
        document.body.classList.add('theme-' + hint);
        return;
      }
    } catch (e) { /* fall through to the player-record read below */ }
    try {
      var sess = JSON.parse(localStorage.getItem('cfbp_session') || 'null');
      var pid  = sess && sess.playerId;
      var key  = 'neutral';                       // signed out: always neutral
      if (pid) {
        // Players live in localStorage in local mode, and in the backend
        // snapshot mirror in googleSheets mode. Check both — the mirror is
        // what a returning player's device actually holds at first paint.
        var players = JSON.parse(localStorage.getItem('cfbp_players') || 'null');
        if (!players) {
          var mirror = JSON.parse(localStorage.getItem('cfbp_sheet_mirror') || 'null');
          players = mirror && mirror.data && mirror.data.cfbp_players;
        }
        if (players && players.length) {
          for (var i = 0; i < players.length; i++) {
            if (players[i] && players[i].playerId === pid) {
              key = (players[i].preferences && players[i].preferences.theme) || 'neutral';
              break;
            }
          }
        }
      }
      document.body.classList.add('theme-' + key);
    } catch (e) { /* fall back to default styles */ }
  })();
</script>

           untouched, and #league-pill stays a PRECEDING SIBLING of
           .header-meta (the `#league-pill[hidden]~.header-meta` rule). -->
      <span class="header-spacer header-spacer--lead" aria-hidden="true"></span>

           entirely, not merely hidden, by the T-15/DI-307 declutter pass on

           with a caret when memberships.length > 1) — this re-wires it by
           giving it a DOM anchor again. `hidden` by default so there is no
           flash of an empty pill before the first render resolves it. -->
      <span id="league-pill" class="league-pill" hidden></span>
      <span class="header-spacer" aria-hidden="true"></span>

           name + status badge, ONE line, no date (DI-393 drops the date
           from the header entirely; it now lives in DI-394's viewing-week
           card on Picks/Dashboard). -->
      <div class="header-meta" id="header-meta"><span id="header-meta-week"><strong>Loading…</strong></span></div>
      <!-- DI-393 — the sync-status icon. `#sync-badge` (id unchanged, so no
           other call site needs updating) now carries `.header-sync-icon`
           and a `data-sync="…"` state attribute instead of emoji text;

           js/icons.js plus an aria-label that changes with the state. The
           red loud-fail banner is unchanged and stays a SEPARATE, louder
           notice — this icon is the persistent quiet one.
           DI-399(a) (UN-359, 2026-09-28) — a real tappable control now, on
           web AND native: `role="button"`, `tabindex="0"` and the
           aria-label itself are all set by updateSyncBadge() (progressive,
           same as `data-sync` always was — left off the static markup here
           so headermetatest's [hdr-e] pin on this exact literal stays a
           true "before the first status event" baseline), bound once by
           bindSyncBadgeTap() at boot. Tap/Enter/Space run runManualSync()
           — the SAME function the pull-to-refresh gesture calls

      <span id="sync-badge" class="header-sync-icon" data-sync=""></span>
    </div>

<!-- Phase III Step 3a (DI-180…184) — THE VENDORED SUPABASE SDK IS NOT TAGGED
     HERE. It used to be: a classic (non-module) script tag for
     vendor/supabase-js-2.116.0.js sat on this line, so every visitor downloaded and parsed the whole
     SDK on every cold load, in a mode ('pins') that never touches it. Reviewer B2:
     a flag that is off must cost nothing. js/app.js's boot() now injects that
     same file, from that same path, ONLY after config.json reports
     authMode:'supabase' (ensureSupabaseSdkLoaded()), and the sha256 pin moved
     with it — SUPABASE_SDK_SHA256 in js/app.js, verified against the bytes on
     disk by authtest.mjs [12]. Still vendored, still same-origin, still no
     CDN and no build step. -->
<!-- Cache-bust the main entry script so a stale browser cache can't serve v9 app.js. -->
<script type="module" src="js/app.js?v=27-1"></script>
<script type="module">
  // Service worker registration + auto-update.
  // The logic moved to js/sw-register.js on 2026-09-10 (reviewer BLOCK F1) so
  // it could be tested without a browser — notifytest.mjs [25]. Behaviour is
  // unchanged for first install and for a genuine release; what changed is
  // that we no longer re-register a differently-queried URL for a worker that
  // is already registered (the OneSignal SDK registers the SAME file as
  // `?appId=…&sdkVersion=…`, and each side re-registering the other's file at
  // the same scope produced an endless install → claim → reload cycle), and a
  // `controllerchange` only reloads when the shell's CACHE_NAME really changed.
  // NOTE: the `?v=` below is still bumped with every release per the deploy
  // checklist, but CACHE_NAME inside service-worker.js is what invalidates the
  // cache — see the RG-04 note in js/sw-register.js.
  import { setupServiceWorker } from './js/sw-register.js';
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      setupServiceWorker({ scriptUrl: 'service-worker.js?v=27-1' })
        .catch(e => console.warn('[SW] setup failed', e)); // CONVENTIONS #4 — every await guarded inside, this keeps it that way
    });
  }
</script>
<!-- DI-301 — the control-center drawer's mount point. Named
     `#control-center-root`, deliberately NOT `#control-center`: that id
     belongs to the drawer element `renderControlCenter()` itself renders
     (a sibling of `#control-center-backdrop`, both produced by ONE
     `rootEl.innerHTML =` call at mount time, js/control-center.js's own
     "fix round 1, finding 1" discipline) — mounting into a container that
     ALSO carried the id `#control-center` would create a duplicate id and
     break `js/nav-gestures.js`'s planned
     `document.querySelector('#control-center[data-open="true"]')` lookup,
     which must resolve the real drawer node, not this wrapper. A sibling of
     `.page-wrapper` (not inside it), per DI-301, so `.page-section`
     display toggling never affects it. No `hidden` attribute — the drawer's
     own `data-open`/`data-phase` attributes and CSS transitions (not the
     native `hidden` attribute, which maps to `display:none` and cannot
     transition) are what gate its visibility; it starts empty and inert by
     construction (`renderControlCenter()`'s initial `phase:'closed'` state
     already carries `inert`). -->
<div id="control-center-root"></div>
